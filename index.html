    </p>
  </section>

  <script>
    // Si las dos frases del aviso quedan en líneas distintas, se oculta el "·" que las separa
    (function () {
      var f = document.querySelector(".nota-alergenos .frases");
      if (!f) { return; }
      var sep = f.querySelector(".sep"), a = f.firstElementChild, b = f.lastElementChild;
      function revisar() {
        sep.style.display = "";
        sep.style.display = b.offsetTop > a.offsetTop ? "none" : "";
      }
      revisar();
      window.addEventListener("resize", revisar);
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(revisar); }
    })();
  </script>
